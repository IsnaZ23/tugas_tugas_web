<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="loginstyle.css">
</head>

<body>
    <div>
        <!-- makek card bootstrep -->
        <div class="card card-log shadow-sm p-2">
            <div class="card-body">

                <div class="text-center mb-4">
                    <h1><b>Login</b></h1>
                </div>


                <form action="home.html">
                    <div class="mb-3">
                        <label for="Username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username">
                    </div>

                    <div class="mb-3">
                        <label for="pw" class="form-label">Password</label>
                        <input type="password" class="form-control" id="pw" name="pw">
                    </div>

                    <div class="mb-3">
                        <label for="gmail" class="form-label">Email </label>
                        <input type="email" class="form-control" id="gmail" name="gmail">
                    </div>

                    <div class="mb-3">
                        <label for="umur" class="form-label">Age </label>
                        <input type="number" class="form-control" id="umur" name="umur">
                    </div>

                    <div class="mb-3">
                        <label for="ultah" class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" id="ultah" name="ultah">
                    </div>

                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label for="remember" class="form-check-label"> Remember me</label>
                    </div>

                    <div class="mb-2">
                        <label class="form-label d-block">Gender</label>

                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" id="male" name="gender" value="male">
                            <label for="male" class="form-check-label">Male</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" id="female" name="gender" value="female">
                            <label for="female" class="form-check-label">Female</label>
                        </div>

                    </div>

                    <div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </div>
                </form>


            </div>
        </div>
    </div>
</body>

</html>
