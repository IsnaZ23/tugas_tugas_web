<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="">
</head>

<body>
    <div>
        <!-- makek card bootstrep -->
        <div class="card">
            <div class="card-body">

                <head>
                    <h1>Login</h1>
                </head>

                <form action="home.html">
                    <div>
                        <label for="unsername">unsername</label><br>
                        <input type="text" id="username" name="username">
                    </div>

                    <div>
                        <label for="password">Password</label><br>
                        <input type="password" id="pw" name="pw">
                    </div>

                    <div>
                        <label for="email">Email </label><br>
                        <input type="email" id="gmail" name="gmail">
                    </div>

                    <div>
                        <label for="umur">Age </label><br>
                        <input type="number" id="umur" name="umur">
                    </div>

                    <div>
                        <label for="date">Date of Birth</label><br>
                        <input type="date" id="ultah" name="ultah">
                    </div>

                    <div>
                        <input type="checkbox">
                        <label for="remember"> Remember me</label>
                    </div>

                    <div>
                        <label>Gender</label><br>
                        <input type="radio"><label for="male">Male</label>
                        <input type="radio"><label for="female">Female</label>
                    </div>

                    <div>
                        <button type="submit" class="btn-Login w-50">Primary</button>
                    </div>
                </form>


            </div>
        </div>
    </div>
</body>

</html>
